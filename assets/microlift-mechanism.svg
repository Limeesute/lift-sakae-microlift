<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
  <title id="title">脂肪細胞の自然死に着目したマイクロリフトの温熱ケア</title>
  <desc id="desc">マイクロ波を照射し、脂肪細胞の自然死という仕組みに着目した温熱ケアの考え方を示す模式図。実際の細胞死や照射深度を実証する図ではありません。</desc>
  <defs><linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7eaf0" stop-opacity=".1"/><stop offset=".65" stop-color="#d4ad7c" stop-opacity=".22"/><stop offset="1" stop-color="#d4ad7c" stop-opacity="0"/></linearGradient><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcf9"/><stop offset="1" stop-color="#d6e3e8"/></linearGradient></defs>
