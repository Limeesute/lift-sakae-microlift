    <text x="320" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="2.8" fill="#859fa9">MICROWAVE / FACIAL CARE.</text>
    <path d="M295 55v49" fill="none" stroke="#a3b9c4" stroke-width="17"/>
    <rect x="244" y="91" width="104" height="63" rx="20" fill="url(#head)" stroke="#9eb7c2" stroke-width="2"/>
    <rect x="222" y="144" width="148" height="24" rx="10" fill="#a4c8d7" stroke="#7ca9bd" stroke-width="1.5"/>
